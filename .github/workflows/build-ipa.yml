name: Build Seven 7 IPA

on:
  push:
    paths:
      - '**.zip'
      - .github/workflows/build-ipa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Extrair o bundle enviado pelo iPhone
        run: |
          ZIP_FILE="<LaTex>(find . -maxdepth 2 -type f -name '*.zip' -not -path './.git/*' -print -quit)"           test -n "</LaTex>ZIP_FILE"
          unzip -q "<LaTex>ZIP_FILE"        - name: Compilar e montar IPA         run: |           ROOT="</LaTex>(find . -maxdepth 3 -type d -name 'ThreeOneOSFive.xcodeproj' -print -quit)"
          ROOT="<LaTex>{ROOT%/ThreeOneOSFive.xcodeproj}"           test -n "</LaTex>ROOT"
          cd "$ROOT"
          chmod +x scripts/build-unsigned-ipa.sh
          scripts/build-unsigned-ipa.sh

      - name: Disponibilizar IPA para download
        uses: actions/upload-artifact@v4
        with:
          name: Seven7-unsigned-ipa
          path: "**/Seven7-unsigned.ipa"
          if-no-files-found: error
          retention-days: 7
