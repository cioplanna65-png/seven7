name: Build Seven 7 IPA

on:
  push:
    paths:
      - 'Seven7-fork-cloud-build.zip'
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Conferir ZIP enviado
        run: |
          pwd
          ls -lah
          test -f Seven7-fork-cloud-build.zip
          unzip -tq Seven7-fork-cloud-build.zip

      - name: Extrair o bundle
        run: unzip -oq Seven7-fork-cloud-build.zip

      - name: Compilar e montar IPA
        run: |
          ROOT="<LaTex>(find . -type d -name 'ThreeOneOSFive.xcodeproj' -print -quit)"           test -n "</LaTex>ROOT"
          ROOT="<LaTex>{ROOT%/ThreeOneOSFive.xcodeproj}"           cd "</LaTex>ROOT"
          chmod +x scripts/build-unsigned-ipa.sh
          scripts/build-unsigned-ipa.sh

      - name: Disponibilizar IPA
        uses: actions/upload-artifact@v4
        with:
          name: Seven7-unsigned-ipa
          path: "**/Seven7-unsigned.ipa"
          if-no-files-found: error
          retention-days: 7
