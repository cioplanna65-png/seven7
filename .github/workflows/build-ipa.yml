name: Build Seven 7 IPA

on:
  push:
    paths:
      - 'Seven7-fork-cloud-build.zip'
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Conferir ZIP
        run: unzip -tq Seven7-fork-cloud-build.zip

      - name: Extrair ZIP
        run: unzip -oq Seven7-fork-cloud-build.zip

      - name: Compilar IPA
        run: |
          cd Seven7-fork-cloud-build
          chmod +x scripts/build-unsigned-ipa.sh
          scripts/build-unsigned-ipa.sh

      - name: Disponibilizar IPA
        uses: actions/upload-artifact@v4
        with:
          name: Seven7-unsigned-ipa
          path: Seven7-fork-cloud-build/Seven7-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
